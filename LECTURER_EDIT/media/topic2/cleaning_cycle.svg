<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="480" viewBox="0 0 1300 480">
<rect width="1300" height="480" rx="32" fill="#f7f9fc"/>
<g font-family="Arial">
<text x="650" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#173a75">A Practical Cleaning Cycle</text>
<g transform="translate(55,130)"><rect width="230" height="185" rx="24" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/><circle cx="115" cy="48" r="26" fill="#234f9b"/><text x="115" y="57" text-anchor="middle" font-size="23" font-weight="700" fill="white">1</text><text x="115" y="103" text-anchor="middle" font-size="27" font-weight="700" fill="#173a75">Inspect</text><text x="115" y="137" text-anchor="middle" font-size="18" fill="#50627b">Understand columns,</text><text x="115" y="163" text-anchor="middle" font-size="18" fill="#50627b">formats and problems</text></g>
<g transform="translate(375,130)"><rect width="230" height="185" rx="24" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/><circle cx="115" cy="48" r="26" fill="#9a6a00"/><text x="115" y="57" text-anchor="middle" font-size="23" font-weight="700" fill="white">2</text><text x="115" y="103" text-anchor="middle" font-size="27" font-weight="700" fill="#7b5600">Detect</text><text x="115" y="137" text-anchor="middle" font-size="18" fill="#50627b">Find missing, duplicate,</text><text x="115" y="163" text-anchor="middle" font-size="18" fill="#50627b">invalid or inconsistent data</text></g>
<g transform="translate(695,130)"><rect width="230" height="185" rx="24" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/><circle cx="115" cy="48" r="26" fill="#2f7a50"/><text x="115" y="57" text-anchor="middle" font-size="23" font-weight="700" fill="white">3</text><text x="115" y="103" text-anchor="middle" font-size="27" font-weight="700" fill="#245d3c">Correct</text><text x="115" y="137" text-anchor="middle" font-size="18" fill="#50627b">Remove, replace,</text><text x="115" y="163" text-anchor="middle" font-size="18" fill="#50627b">standardise or flag</text></g>
<g transform="translate(1015,130)"><rect width="230" height="185" rx="24" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/><circle cx="115" cy="48" r="26" fill="#6b538f"/><text x="115" y="57" text-anchor="middle" font-size="23" font-weight="700" fill="white">4</text><text x="115" y="103" text-anchor="middle" font-size="27" font-weight="700" fill="#5d477f">Validate</text><text x="115" y="137" text-anchor="middle" font-size="18" fill="#50627b">Check that corrections</text><text x="115" y="163" text-anchor="middle" font-size="18" fill="#50627b">did not create new errors</text></g>
<g stroke="#7b91b5" stroke-width="7"><line x1="295" y1="222" x2="355" y2="222"/><line x1="615" y1="222" x2="675" y2="222"/><line x1="935" y1="222" x2="995" y2="222"/></g>
<g fill="#7b91b5"><polygon points="355,222 335,210 335,234"/><polygon points="675,222 655,210 655,234"/><polygon points="995,222 975,210 975,234"/></g>
