<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="600" viewBox="0 0 1300 600">
<rect width="1300" height="600" rx="32" fill="#f7f9fc"/>
<text x="650" y="64" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Data Quality Questions</text>
<g font-family="Arial">
  <g transform="translate(80,125)"><rect width="350" height="150" rx="22" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/><text x="175" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#173a75">Completeness</text><text x="175" y="94" text-anchor="middle" font-size="19" fill="#50627b">Are important values missing?</text></g>
  <g transform="translate(475,125)"><rect width="350" height="150" rx="22" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/><text x="175" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#245d3c">Accuracy</text><text x="175" y="94" text-anchor="middle" font-size="19" fill="#50627b">Do values reflect reality?</text></g>
  <g transform="translate(870,125)"><rect width="350" height="150" rx="22" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/><text x="175" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#7b5600">Consistency</text><text x="175" y="94" text-anchor="middle" font-size="19" fill="#50627b">Are formats and meanings uniform?</text></g>
  <g transform="translate(275,340)"><rect width="350" height="150" rx="22" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/><text x="175" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#5d477f">Validity</text><text x="175" y="94" text-anchor="middle" font-size="19" fill="#50627b">Do values follow allowed rules?</text></g>
  <g transform="translate(675,340)"><rect width="350" height="150" rx="22" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/><text x="175" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6465">Uniqueness</text><text x="175" y="94" text-anchor="middle" font-size="19" fill="#50627b">Are records duplicated?</text></g>
</g>
</svg>