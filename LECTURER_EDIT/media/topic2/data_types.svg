<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650">
<rect width="1300" height="650" rx="32" fill="#f7f9fc"/>
<text x="650" y="62" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Common Forms of Data</text>
<g font-family="Arial">
  <g transform="translate(70,120)">
    <rect width="350" height="210" rx="24" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/>
    <text x="175" y="55" text-anchor="middle" font-size="28" font-weight="700" fill="#173a75">Structured</text>
    <text x="175" y="98" text-anchor="middle" font-size="20" fill="#50627b">Rows, columns, fixed fields</text>
    <text x="175" y="135" text-anchor="middle" font-size="19" fill="#50627b">Examples: spreadsheets,</text>
    <text x="175" y="163" text-anchor="middle" font-size="19" fill="#50627b">database tables</text>
  </g>
  <g transform="translate(475,120)">
    <rect width="350" height="210" rx="24" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/>
    <text x="175" y="55" text-anchor="middle" font-size="28" font-weight="700" fill="#245d3c">Semi-structured</text>
    <text x="175" y="98" text-anchor="middle" font-size="20" fill="#50627b">Organised, but not rigid tables</text>
    <text x="175" y="135" text-anchor="middle" font-size="19" fill="#50627b">Examples: JSON, XML,</text>
    <text x="175" y="163" text-anchor="middle" font-size="19" fill="#50627b">web records</text>
  </g>
  <g transform="translate(880,120)">
    <rect width="350" height="210" rx="24" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/>
    <text x="175" y="55" text-anchor="middle" font-size="28" font-weight="700" fill="#7b5600">Unstructured</text>
    <text x="175" y="98" text-anchor="middle" font-size="20" fill="#50627b">No fixed row-column format</text>
    <text x="175" y="135" text-anchor="middle" font-size="19" fill="#50627b">Examples: text, images,</text>
    <text x="175" y="163" text-anchor="middle" font-size="19" fill="#50627b">audio, video</text>
  </g>
  <g transform="translate(170,405)">
    <rect width="440" height="155" rx="22" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/>
    <text x="220" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#5d477f">Numerical</text>
    <text x="220" y="86" text-anchor="middle" font-size="19" fill="#50627b">Counts or measurements</text>
    <text x="220" y="116" text-anchor="middle" font-size="18" fill="#50627b">Age, rainfall, marks, income</text>
  </g>
  <g transform="translate(690,405)">
    <rect width="440" height="155" rx="22" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/>
    <text x="220" y="48" text-anchor="middle" font-size="27" font-weight="700" fill="#2b6465">Categorical</text>
    <text x="220" y="86" text-anchor="middle" font-size="19" fill="#50627b">Groups, labels or classes</text>
    <text x="220" y="116" text-anchor="middle" font-size="18" fill="#50627b">Region, programme, crop type</text>
  </g>
</g>
</svg>