<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560">
<rect width="1300" height="560" rx="32" fill="#f7f9fc"/>
<text x="650" y="64" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Common Data Preprocessing Operations</text>
<g font-family="Arial">
  <g transform="translate(75,130)"><rect width="350" height="150" rx="22" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/><text x="175" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#173a75">Standardise formats</text><text x="175" y="94" text-anchor="middle" font-size="18" fill="#50627b">Dates, units, spelling, labels</text></g>
  <g transform="translate(475,130)"><rect width="350" height="150" rx="22" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/><text x="175" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#245d3c">Encode categories</text><text x="175" y="94" text-anchor="middle" font-size="18" fill="#50627b">Convert labels into usable values</text></g>
  <g transform="translate(875,130)"><rect width="350" height="150" rx="22" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/><text x="175" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#7b5600">Scale numbers</text><text x="175" y="94" text-anchor="middle" font-size="18" fill="#50627b">Place measures on comparable ranges</text></g>
  <g transform="translate(275,345)"><rect width="350" height="150" rx="22" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/><text x="175" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#5d477f">Transform / derive</text><text x="175" y="94" text-anchor="middle" font-size="18" fill="#50627b">Create useful representations or features</text></g>
  <g transform="translate(675,345)"><rect width="350" height="150" rx="22" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/><text x="175" y="52" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6465">Select / split</text><text x="175" y="94" text-anchor="middle" font-size="18" fill="#50627b">Keep relevant data and prepare subsets</text></g>
</g>
</svg>