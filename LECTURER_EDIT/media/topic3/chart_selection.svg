<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="660" viewBox="0 0 1300 660">
<rect width="1300" height="660" rx="32" fill="#f7f9fc"/>
<text x="650" y="60" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Choosing a Basic Visualisation</text>
<g font-family="Arial">
  <g transform="translate(70,120)"><rect width="360" height="200" rx="24" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/><text x="180" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#173a75">Compare categories</text><rect x="72" y="86" width="38" height="70" fill="#234f9b"/><rect x="132" y="62" width="38" height="94" fill="#547ab9"/><rect x="192" y="110" width="38" height="46" fill="#7fa2df"/><rect x="252" y="42" width="38" height="114" fill="#9db7e1"/><text x="180" y="184" text-anchor="middle" font-size="20" fill="#50627b">Bar chart</text></g>
  <g transform="translate(470,120)"><rect width="360" height="200" rx="24" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/><text x="180" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#245d3c">See a distribution</text><g fill="#3f8b60"><rect x="62" y="130" width="42" height="26"/><rect x="108" y="102" width="42" height="54"/><rect x="154" y="66" width="42" height="90"/><rect x="200" y="50" width="42" height="106"/><rect x="246" y="88" width="42" height="68"/></g><text x="180" y="184" text-anchor="middle" font-size="20" fill="#50627b">Histogram</text></g>
  <g transform="translate(870,120)"><rect width="360" height="200" rx="24" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/><text x="180" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#7b5600">Relate two numbers</text><g fill="#a97500"><circle cx="84" cy="130" r="8"/><circle cx="126" cy="112" r="8"/><circle cx="160" cy="116" r="8"/><circle cx="205" cy="84" r="8"/><circle cx="250" cy="66" r="8"/><circle cx="285" cy="52" r="8"/></g><text x="180" y="184" text-anchor="middle" font-size="20" fill="#50627b">Scatter plot</text></g>
  <g transform="translate(270,390)"><rect width="360" height="190" rx="24" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/><text x="180" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#5d477f">Show change over time</text><polyline points="55,140 105,116 155,122 205,82 255,72 305,48" fill="none" stroke="#6b538f" stroke-width="7"/><text x="180" y="174" text-anchor="middle" font-size="20" fill="#50627b">Line chart</text></g>
  <g transform="translate(670,390)"><rect width="360" height="190" rx="24" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/><text x="180" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#2b6465">Compare distribution summaries</text><line x1="70" y1="110" x2="290" y2="110" stroke="#337879" stroke-width="4"/><rect x="125" y="82" width="110" height="56" fill="#cfe9e9" stroke="#337879" stroke-width="4"/><line x1="180" y1="82" x2="180" y2="138" stroke="#337879" stroke-width="4"/><text x="180" y="174" text-anchor="middle" font-size="20" fill="#50627b">Box plot</text></g>
</g>
</svg>