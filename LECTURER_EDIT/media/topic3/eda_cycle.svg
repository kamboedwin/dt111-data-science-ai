<text x="650" y="60" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Exploratory Data Analysis: An Iterative Process</text>
<g font-family="Arial">
  <g transform="translate(85,145)"><rect width="220" height="180" rx="24" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/><circle cx="110" cy="48" r="27" fill="#234f9b"/><text x="110" y="57" text-anchor="middle" font-size="23" font-weight="700" fill="white">1</text><text x="110" y="102" text-anchor="middle" font-size="26" font-weight="700" fill="#173a75">Understand</text><text x="110" y="137" text-anchor="middle" font-size="18" fill="#50627b">Variables, units, context</text></g>
  <g transform="translate(345,145)"><rect width="220" height="180" rx="24" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/><circle cx="110" cy="48" r="27" fill="#2f7a50"/><text x="110" y="57" text-anchor="middle" font-size="23" font-weight="700" fill="white">2</text><text x="110" y="102" text-anchor="middle" font-size="26" font-weight="700" fill="#245d3c">Summarise</text><text x="110" y="137" text-anchor="middle" font-size="18" fill="#50627b">Counts and statistics</text></g>
  <g transform="translate(605,145)"><rect width="220" height="180" rx="24" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/><circle cx="110" cy="48" r="27" fill="#9a6a00"/><text x="110" y="57" text-anchor="middle" font-size="23" font-weight="700" fill="white">3</text><text x="110" y="102" text-anchor="middle" font-size="26" font-weight="700" fill="#7b5600">Visualise</text><text x="110" y="137" text-anchor="middle" font-size="18" fill="#50627b">Distributions and patterns</text></g>
  <g transform="translate(865,145)"><rect width="220" height="180" rx="24" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/><circle cx="110" cy="48" r="27" fill="#6b538f"/><text x="110" y="57" text-anchor="middle" font-size="23" font-weight="700" fill="white">4</text><text x="110" y="102" text-anchor="middle" font-size="26" font-weight="700" fill="#5d477f">Question</text><text x="110" y="137" text-anchor="middle" font-size="18" fill="#50627b">What needs explanation?</text></g>
  <g transform="translate(1125,145)"><rect width="100" height="180" rx="24" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/><text x="50" y="76" text-anchor="middle" font-size="21" font-weight="700" fill="#2b6465">Repeat</text><text x="50" y="110" text-anchor="middle" font-size="18" fill="#50627b">Refine</text><text x="50" y="137" text-anchor="middle" font-size="18" fill="#50627b">Explore</text></g>
  <g stroke="#7b91b5" stroke-width="6"><line x1="315" y1="235" x2="335" y2="235"/><line x1="575" y1="235" x2="595" y2="235"/><line x1="835" y1="235" x2="855" y2="235"/><line x1="1095" y1="235" x2="1115" y2="235"/></g>
</g>
<text x="650" y="415" text-anchor="middle" font-family="Arial" font-size="22" fill="#667085">EDA is not a one-time calculation. We inspect, compare, ask questions and revisit the data.</text>
