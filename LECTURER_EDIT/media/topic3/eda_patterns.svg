<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="620" viewBox="0 0 1300 620">
<rect width="1300" height="620" rx="32" fill="#f7f9fc"/>
<text x="650" y="60" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">What Are We Looking For During EDA?</text>
<g font-family="Arial">
<g transform="translate(90,130)"><rect width="340" height="180" rx="24" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/><text x="170" y="55" text-anchor="middle" font-size="27" font-weight="700" fill="#173a75">Distribution</text><text x="170" y="98" text-anchor="middle" font-size="19" fill="#50627b">Where values concentrate</text><text x="170" y="128" text-anchor="middle" font-size="19" fill="#50627b">and how they spread</text></g>
<g transform="translate(480,130)"><rect width="340" height="180" rx="24" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/><text x="170" y="55" text-anchor="middle" font-size="27" font-weight="700" fill="#245d3c">Relationship</text><text x="170" y="98" text-anchor="middle" font-size="19" fill="#50627b">Whether variables move</text><text x="170" y="128" text-anchor="middle" font-size="19" fill="#50627b">together or differ</text></g>
<g transform="translate(870,130)"><rect width="340" height="180" rx="24" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/><text x="170" y="55" text-anchor="middle" font-size="27" font-weight="700" fill="#7b5600">Groups</text><text x="170" y="98" text-anchor="middle" font-size="19" fill="#50627b">How categories or</text><text x="170" y="128" text-anchor="middle" font-size="19" fill="#50627b">sub-populations differ</text></g>
<g transform="translate(285,365)"><rect width="340" height="180" rx="24" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/><text x="170" y="55" text-anchor="middle" font-size="27" font-weight="700" fill="#5d477f">Trend</text><text x="170" y="98" text-anchor="middle" font-size="19" fill="#50627b">How something changes</text><text x="170" y="128" text-anchor="middle" font-size="19" fill="#50627b">across ordered values or time</text></g>
<g transform="translate(675,365)"><rect width="340" height="180" rx="24" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/><text x="170" y="55" text-anchor="middle" font-size="27" font-weight="700" fill="#2b6465">Anomaly</text><text x="170" y="98" text-anchor="middle" font-size="19" fill="#50627b">Values or cases that</text><text x="170" y="128" text-anchor="middle" font-size="19" fill="#50627b">deserve closer inspection</text></g>
</g>
</svg>