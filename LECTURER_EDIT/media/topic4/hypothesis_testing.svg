<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="500" viewBox="0 0 1300 500">
<rect width="1300" height="500" rx="32" fill="#f7f9fc"/>
<text x="650" y="60" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">A Simple Hypothesis Testing Workflow</text>
<g font-family="Arial">
  <g transform="translate(60,150)">
    <rect width="200" height="170" rx="24" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/>
    <circle cx="100" cy="45" r="24" fill="#234f9b"/>
    <text x="100" y="53" text-anchor="middle" font-size="22" font-weight="700" fill="white">1</text>
    <text x="100" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#173a75">Question</text>
    <text x="100" y="132" text-anchor="middle" font-size="18" fill="#50627b">What claim or issue</text>
    <text x="100" y="156" text-anchor="middle" font-size="18" fill="#50627b">do we want to test?</text>
  </g>
  <g transform="translate(300,150)">
    <rect width="200" height="170" rx="24" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/>
    <circle cx="100" cy="45" r="24" fill="#2f7a50"/>
    <text x="100" y="53" text-anchor="middle" font-size="22" font-weight="700" fill="white">2</text>
    <text x="100" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#245d3c">Hypotheses</text>
    <text x="100" y="132" text-anchor="middle" font-size="18" fill="#50627b">Set H₀ and H₁</text>
    <text x="100" y="156" text-anchor="middle" font-size="18" fill="#50627b">as competing claims</text>
  </g>
  <g transform="translate(540,150)">
    <rect width="200" height="170" rx="24" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/>
    <circle cx="100" cy="45" r="24" fill="#9a6a00"/>
    <text x="100" y="53" text-anchor="middle" font-size="22" font-weight="700" fill="white">3</text>
    <text x="100" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#7b5600">Evidence</text>
    <text x="100" y="132" text-anchor="middle" font-size="18" fill="#50627b">Compute a test</text>
    <text x="100" y="156" text-anchor="middle" font-size="18" fill="#50627b">statistic and p-value</text>
  </g>
  <g transform="translate(780,150)">
    <rect width="200" height="170" rx="24" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/>
    <circle cx="100" cy="45" r="24" fill="#6b538f"/>
    <text x="100" y="53" text-anchor="middle" font-size="22" font-weight="700" fill="white">4</text>
    <text x="100" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#5d477f">Decision</text>
    <text x="100" y="132" text-anchor="middle" font-size="18" fill="#50627b">Reject or fail to</text>
    <text x="100" y="156" text-anchor="middle" font-size="18" fill="#50627b">reject H₀</text>
  </g>
  <g transform="translate(1020,150)">
    <rect width="200" height="170" rx="24" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/>
    <circle cx="100" cy="45" r="24" fill="#337879"/>
    <text x="100" y="53" text-anchor="middle" font-size="22" font-weight="700" fill="white">5</text>
    <text x="100" y="98" text-anchor="middle" font-size="24" font-weight="700" fill="#2b6465">Interpret</text>
    <text x="100" y="132" text-anchor="middle" font-size="18" fill="#50627b">Explain what the</text>
    <text x="100" y="156" text-anchor="middle" font-size="18" fill="#50627b">evidence means</text>
  </g>
  <g stroke="#7b91b5" stroke-width="6">
    <line x1="260" y1="235" x2="295" y2="235"/><line x1="500" y1="235" x2="535" y2="235"/><line x1="740" y1="235" x2="775" y2="235"/><line x1="980" y1="235" x2="1015" y2="235"/>
  </g>
</g>
</svg>