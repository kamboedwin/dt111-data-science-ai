<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="620" viewBox="0 0 1300 620">
<rect width="1300" height="620" rx="32" fill="#f7f9fc"/>
<text x="650" y="60" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Probability and Distributions: Core Ideas</text>
<g font-family="Arial">
  <g transform="translate(70,120)">
    <rect width="350" height="190" rx="24" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/>
    <text x="175" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#173a75">Probability</text>
    <text x="175" y="96" text-anchor="middle" font-size="19" fill="#50627b">A numerical description of</text>
    <text x="175" y="126" text-anchor="middle" font-size="19" fill="#50627b">how likely an event is</text>
    <text x="175" y="160" text-anchor="middle" font-size="18" fill="#50627b">0 = impossible · 1 = certain</text>
  </g>
  <g transform="translate(470,120)">
    <rect width="350" height="190" rx="24" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/>
    <text x="175" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#245d3c">Distribution</text>
    <text x="175" y="96" text-anchor="middle" font-size="19" fill="#50627b">How values or probabilities</text>
    <text x="175" y="126" text-anchor="middle" font-size="19" fill="#50627b">are spread across outcomes</text>
    <polyline points="62,160 115,140 168,110 221,95 274,125 327,160" fill="none" stroke="#2f7a50" stroke-width="6"/>
  </g>
  <g transform="translate(870,120)">
    <rect width="350" height="190" rx="24" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/>
    <text x="175" y="52" text-anchor="middle" font-size="28" font-weight="700" fill="#7b5600">Expected value</text>
    <text x="175" y="96" text-anchor="middle" font-size="19" fill="#50627b">A long-run average or central</text>
    <text x="175" y="126" text-anchor="middle" font-size="19" fill="#50627b">value suggested by the model</text>
    <text x="175" y="160" text-anchor="middle" font-size="18" fill="#50627b">Useful for interpreting tendency</text>
  </g>

  <g transform="translate(185,360)">
    <rect width="400" height="180" rx="24" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/>
    <text x="200" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#5d477f">Discrete distribution</text>
    <g fill="#7d68b5"><rect x="65" y="100" width="40" height="30"/><rect x="125" y="75" width="40" height="55"/><rect x="185" y="45" width="40" height="85"/><rect x="245" y="75" width="40" height="55"/><rect x="305" y="100" width="40" height="30"/></g>
    <text x="200" y="160" text-anchor="middle" font-size="18" fill="#50627b">Separated outcomes, e.g. number of heads</text>
  </g>

  <g transform="translate(705,360)">
    <rect width="400" height="180" rx="24" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/>
    <text x="200" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#2b6465">Continuous distribution</text>
    <path d="M55 140 C120 130 130 70 205 65 C270 62 300 115 345 140" fill="none" stroke="#337879" stroke-width="7"/>
    <text x="200" y="160" text-anchor="middle" font-size="18" fill="#50627b">Measured values, e.g. height, time, score</text>
  </g>
</g>
</svg>