<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="580" viewBox="0 0 1300 580">
<rect width="1300" height="580" rx="32" fill="#f7f9fc"/>
<text x="650" y="60" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Regression Analysis: Linking Variables</text>
<g font-family="Arial">
  <g transform="translate(75,110)">
    <rect width="760" height="390" rx="22" fill="#ffffff" stroke="#dce3ee" stroke-width="2"/>
    <line x1="85" y1="330" x2="690" y2="330" stroke="#718096" stroke-width="3"/>
    <line x1="85" y1="330" x2="85" y2="55" stroke="#718096" stroke-width="3"/>
    <text x="387" y="366" text-anchor="middle" font-size="18" fill="#667085">Study hours</text>
    <text x="36" y="195" text-anchor="middle" font-size="18" fill="#667085" transform="rotate(-90 36 195)">Final score</text>
    <circle cx="135" cy="285" r="8" fill="#234f9b"/><circle cx="185" cy="260" r="8" fill="#234f9b"/><circle cx="235" cy="240" r="8" fill="#234f9b"/><circle cx="285" cy="225" r="8" fill="#234f9b"/><circle cx="335" cy="195" r="8" fill="#234f9b"/><circle cx="395" cy="178" r="8" fill="#234f9b"/><circle cx="455" cy="155" r="8" fill="#234f9b"/><circle cx="515" cy="132" r="8" fill="#234f9b"/><circle cx="575" cy="118" r="8" fill="#234f9b"/><circle cx="635" cy="90" r="8" fill="#234f9b"/>
    <line x1="110" y1="300" x2="650" y2="95" stroke="#c14f4f" stroke-width="6"/>
    <text x="535" y="76" text-anchor="middle" font-size="18" font-weight="700" fill="#a53f3f">Regression line</text>
  </g>

  <g transform="translate(890,145)">
    <rect width="330" height="130" rx="20" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/>
    <text x="165" y="43" text-anchor="middle" font-size="26" font-weight="700" fill="#173a75">Slope</text>
    <text x="165" y="77" text-anchor="middle" font-size="18" fill="#50627b">How much Y tends to change</text>
    <text x="165" y="102" text-anchor="middle" font-size="18" fill="#50627b">when X increases by one unit</text>
  </g>
  <g transform="translate(890,305)">
    <rect width="330" height="130" rx="20" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/>
    <text x="165" y="43" text-anchor="middle" font-size="26" font-weight="700" fill="#245d3c">Prediction</text>
    <text x="165" y="77" text-anchor="middle" font-size="18" fill="#50627b">Use the fitted line to estimate</text>
    <text x="165" y="102" text-anchor="middle" font-size="18" fill="#50627b">a likely value of Y for a given X</text>
  </g>
</g>
</svg>