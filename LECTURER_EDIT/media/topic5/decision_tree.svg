<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650">
<rect width="1300" height="650" rx="32" fill="#f7f9fc"/>
<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">A Simple Decision Tree</text>
<g font-family="Arial">
  <rect x="465" y="105" width="370" height="90" rx="22" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/>
  <text x="650" y="145" text-anchor="middle" font-size="26" font-weight="700" fill="#173a75">Attendance ≥ 80%?</text>

  <line x1="570" y1="195" x2="350" y2="295" stroke="#7b91b5" stroke-width="5"/>
  <line x1="730" y1="195" x2="950" y2="295" stroke="#7b91b5" stroke-width="5"/>
  <text x="445" y="235" text-anchor="middle" font-size="20" fill="#50627b">No</text>
  <text x="855" y="235" text-anchor="middle" font-size="20" fill="#50627b">Yes</text>

  <rect x="190" y="295" width="320" height="90" rx="22" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/>
  <text x="350" y="335" text-anchor="middle" font-size="25" font-weight="700" fill="#7b5600">Assignment score ≥ 65?</text>

  <rect x="790" y="295" width="320" height="90" rx="22" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/>
  <text x="950" y="348" text-anchor="middle" font-size="28" font-weight="700" fill="#245d3c">Predict PASS</text>

  <line x1="285" y1="385" x2="210" y2="475" stroke="#7b91b5" stroke-width="5"/>
  <line x1="415" y1="385" x2="490" y2="475" stroke="#7b91b5" stroke-width="5"/>
  <text x="235" y="430" text-anchor="middle" font-size="20" fill="#50627b">No</text>
  <text x="465" y="430" text-anchor="middle" font-size="20" fill="#50627b">Yes</text>

  <rect x="80" y="475" width="260" height="90" rx="22" fill="#f8eeee" stroke="#c98989" stroke-width="3"/>
  <text x="210" y="528" text-anchor="middle" font-size="28" font-weight="700" fill="#883e3e">Predict FAIL</text>

  <rect x="360" y="475" width="260" height="90" rx="22" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/>
  <text x="490" y="528" text-anchor="middle" font-size="28" font-weight="700" fill="#245d3c">Predict PASS</text>

  <text x="650" y="615" text-anchor="middle" font-size="20" fill="#667085">Decision trees make predictions by following a sequence of simple questions.</text>
</g>
</svg>