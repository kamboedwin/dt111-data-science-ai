<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="620" viewBox="0 0 1300 620">
<rect width="1300" height="620" rx="32" fill="#f7f9fc"/>
<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">K-Means Clustering: Discovering Groups</text>
<g font-family="Arial">
  <rect x="100" y="105" width="760" height="420" rx="24" fill="#ffffff" stroke="#dce3ee" stroke-width="2"/>
  <line x1="180" y1="455" x2="790" y2="455" stroke="#718096" stroke-width="3"/>
  <line x1="180" y1="455" x2="180" y2="165" stroke="#718096" stroke-width="3"/>
  <text x="485" y="495" text-anchor="middle" font-size="18" fill="#667085">Feature 1</text>
  <text x="132" y="310" text-anchor="middle" font-size="18" fill="#667085" transform="rotate(-90 132 310)">Feature 2</text>

  <g fill="#2f7a50"><circle cx="260" cy="360" r="10"/><circle cx="290" cy="330" r="10"/><circle cx="325" cy="380" r="10"/><circle cx="345" cy="340" r="10"/><circle cx="305" cy="300" r="10"/></g>
  <g fill="#7d68b5"><circle cx="510" cy="245" r="10"/><circle cx="545" cy="220" r="10"/><circle cx="575" cy="275" r="10"/><circle cx="610" cy="235" r="10"/><circle cx="640" cy="265" r="10"/></g>
  <g fill="#c28b2f"><circle cx="650" cy="395" r="10"/><circle cx="690" cy="370" r="10"/><circle cx="720" cy="415" r="10"/><circle cx="750" cy="380" r="10"/><circle cx="705" cy="340" r="10"/></g>

  <text x="295" y="405" text-anchor="middle" font-size="18" font-weight="700" fill="#245d3c">Cluster A</text>
  <text x="575" y="200" text-anchor="middle" font-size="18" font-weight="700" fill="#5d477f">Cluster B</text>
  <text x="710" y="445" text-anchor="middle" font-size="18" font-weight="700" fill="#7b5600">Cluster C</text>

  <g transform="translate(915,160)">
    <rect width="300" height="300" rx="24" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/>
    <text x="150" y="52" text-anchor="middle" font-size="27" font-weight="700" fill="#173a75">Basic idea</text>
    <text x="150" y="100" text-anchor="middle" font-size="18" fill="#50627b">1. Choose K groups</text>
    <text x="150" y="135" text-anchor="middle" font-size="18" fill="#50627b">2. Assign points to</text>
    <text x="150" y="160" text-anchor="middle" font-size="18" fill="#50627b">nearby centres</text>
    <text x="150" y="200" text-anchor="middle" font-size="18" fill="#50627b">3. Move centres</text>
    <text x="150" y="225" text-anchor="middle" font-size="18" fill="#50627b">4. Repeat</text>
    <text x="150" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#234f9b">No target labels are needed</text>
  </g>
</g>
</svg>