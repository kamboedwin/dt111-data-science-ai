<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="560" viewBox="0 0 1300 560">
<rect width="1300" height="560" rx="32" fill="#f7f9fc"/>
<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Training, Evaluation and Generalisation</text>
<g font-family="Arial">
  <rect x="95" y="145" width="340" height="220" rx="24" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/>
  <text x="265" y="195" text-anchor="middle" font-size="30" font-weight="700" fill="#173a75">Training data</text>
  <text x="265" y="235" text-anchor="middle" font-size="19" fill="#50627b">Examples used to learn</text>
  <text x="265" y="265" text-anchor="middle" font-size="19" fill="#50627b">patterns or model parameters</text>
  <text x="265" y="320" text-anchor="middle" font-size="48" font-weight="700" fill="#234f9b">80%</text>

  <line x1="435" y1="255" x2="560" y2="255" stroke="#7b91b5" stroke-width="6"/>
  <polygon points="560,255 535,240 535,270" fill="#7b91b5"/>

  <rect x="565" y="145" width="220" height="220" rx="24" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/>
  <text x="675" y="195" text-anchor="middle" font-size="30" font-weight="700" fill="#245d3c">Model</text>
  <text x="675" y="240" text-anchor="middle" font-size="19" fill="#50627b">Learns from</text>
  <text x="675" y="267" text-anchor="middle" font-size="19" fill="#50627b">training examples</text>

  <line x1="785" y1="255" x2="905" y2="255" stroke="#7b91b5" stroke-width="6"/>
  <polygon points="905,255 880,240 880,270" fill="#7b91b5"/>

  <rect x="910" y="145" width="300" height="220" rx="24" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/>
  <text x="1060" y="195" text-anchor="middle" font-size="30" font-weight="700" fill="#7b5600">Test data</text>
  <text x="1060" y="235" text-anchor="middle" font-size="19" fill="#50627b">Held back to estimate</text>
  <text x="1060" y="265" text-anchor="middle" font-size="19" fill="#50627b">generalisation performance</text>
  <text x="1060" y="320" text-anchor="middle" font-size="48" font-weight="700" fill="#9a6a00">20%</text>

  <text x="650" y="455" text-anchor="middle" font-size="23" font-weight="700" fill="#173a75">A useful model should perform well on new, unseen data — not only on examples it already saw.</text>
  <text x="650" y="495" text-anchor="middle" font-size="20" fill="#667085">Split percentages are illustrative; different projects may use different strategies.</text>
</g>
</svg>