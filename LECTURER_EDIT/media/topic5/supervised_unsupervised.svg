<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640">
<rect width="1300" height="640" rx="32" fill="#f7f9fc"/>
<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Two Broad Machine Learning Approaches</text>
<g font-family="Arial">
  <g transform="translate(90,120)">
    <rect width="520" height="420" rx="28" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/>
    <text x="260" y="62" text-anchor="middle" font-size="32" font-weight="700" fill="#173a75">Supervised Learning</text>
    <text x="260" y="105" text-anchor="middle" font-size="20" fill="#50627b">Learn from examples with known targets</text>
    <rect x="62" y="155" width="170" height="115" rx="16" fill="#ffffff" stroke="#b8c9e7"/>
    <text x="147" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#234f9b">Inputs</text>
    <text x="147" y="226" text-anchor="middle" font-size="17" fill="#50627b">Study hours</text>
    <text x="147" y="249" text-anchor="middle" font-size="17" fill="#50627b">Attendance</text>
    <rect x="288" y="155" width="170" height="115" rx="16" fill="#ffffff" stroke="#b8c9e7"/>
    <text x="373" y="195" text-anchor="middle" font-size="22" font-weight="700" fill="#234f9b">Known target</text>
    <text x="373" y="226" text-anchor="middle" font-size="17" fill="#50627b">Final score</text>
    <text x="373" y="249" text-anchor="middle" font-size="17" fill="#50627b">or Pass/Fail</text>
    <line x1="232" y1="212" x2="288" y2="212" stroke="#7b91b5" stroke-width="5"/>
    <text x="260" y="319" text-anchor="middle" font-size="24" font-weight="700" fill="#173a75">Common tasks</text>
    <text x="260" y="355" text-anchor="middle" font-size="19" fill="#50627b">Regression → predict a number</text>
    <text x="260" y="388" text-anchor="middle" font-size="19" fill="#50627b">Classification → predict a class</text>
  </g>
  <g transform="translate(690,120)">
    <rect width="520" height="420" rx="28" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/>
    <text x="260" y="62" text-anchor="middle" font-size="32" font-weight="700" fill="#245d3c">Unsupervised Learning</text>
    <text x="260" y="105" text-anchor="middle" font-size="20" fill="#50627b">Learn structure without known targets</text>
    <circle cx="140" cy="210" r="16" fill="#2f7a50"/><circle cx="180" cy="175" r="16" fill="#2f7a50"/><circle cx="205" cy="220" r="16" fill="#2f7a50"/>
    <circle cx="330" cy="190" r="16" fill="#7d68b5"/><circle cx="365" cy="235" r="16" fill="#7d68b5"/><circle cx="410" cy="185" r="16" fill="#7d68b5"/>
    <circle cx="260" cy="300" r="16" fill="#c28b2f"/><circle cx="305" cy="335" r="16" fill="#c28b2f"/><circle cx="225" cy="350" r="16" fill="#c28b2f"/>
    <text x="260" y="395" text-anchor="middle" font-size="24" font-weight="700" fill="#245d3c">Common task</text>
    <text x="260" y="430" text-anchor="middle" font-size="19" fill="#50627b">Clustering → discover groups or structure</text>
  </g>
</g>
</svg>