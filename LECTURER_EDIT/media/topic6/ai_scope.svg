<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650">
<rect width="1300" height="650" rx="32" fill="#f7f9fc"/>
<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Artificial Intelligence: Scope and Approaches</text>
<g font-family="Arial">
  <circle cx="650" cy="325" r="120" fill="#eef4ff" stroke="#7fa2df" stroke-width="4"/>
  <text x="650" y="315" text-anchor="middle" font-size="34" font-weight="700" fill="#173a75">Artificial</text>
  <text x="650" y="355" text-anchor="middle" font-size="34" font-weight="700" fill="#173a75">Intelligence</text>

  <g transform="translate(100,115)">
    <rect width="310" height="145" rx="22" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/>
    <text x="155" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#245d3c">Search &amp; Planning</text>
    <text x="155" y="86" text-anchor="middle" font-size="18" fill="#50627b">Explore possible actions</text>
    <text x="155" y="112" text-anchor="middle" font-size="18" fill="#50627b">to reach a goal</text>
  </g>
  <g transform="translate(890,115)">
    <rect width="310" height="145" rx="22" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/>
    <text x="155" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#7b5600">Logic &amp; Reasoning</text>
    <text x="155" y="86" text-anchor="middle" font-size="18" fill="#50627b">Represent facts and rules</text>
    <text x="155" y="112" text-anchor="middle" font-size="18" fill="#50627b">and infer conclusions</text>
  </g>
  <g transform="translate(100,405)">
    <rect width="310" height="145" rx="22" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/>
    <text x="155" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#5d477f">Machine Learning</text>
    <text x="155" y="86" text-anchor="middle" font-size="18" fill="#50627b">Learn patterns from data</text>
    <text x="155" y="112" text-anchor="middle" font-size="18" fill="#50627b">for prediction or grouping</text>
  </g>
  <g transform="translate(890,405)">
    <rect width="310" height="145" rx="22" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/>
    <text x="155" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6465">Perception &amp; Language</text>
    <text x="155" y="86" text-anchor="middle" font-size="18" fill="#50627b">Images, speech, text</text>
    <text x="155" y="112" text-anchor="middle" font-size="18" fill="#50627b">and human interaction</text>
  </g>

  <g stroke="#8ea1bf" stroke-width="5">
    <line x1="410" y1="210" x2="545" y2="270"/><line x1="890" y1="210" x2="755" y2="270"/>
    <line x1="410" y1="477" x2="545" y2="380"/><line x1="890" y1="477" x2="755" y2="380"/>
  </g>
</g>
</svg>