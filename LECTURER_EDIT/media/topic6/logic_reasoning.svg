<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="580" viewBox="0 0 1300 580">
<rect width="1300" height="580" rx="32" fill="#f7f9fc"/>
<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Logic and Reasoning: From Facts and Rules to Conclusions</text>
<g font-family="Arial">
  <g transform="translate(80,135)">
    <rect width="330" height="245" rx="24" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/>
    <text x="165" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#173a75">Facts</text>
    <text x="165" y="100" text-anchor="middle" font-size="20" fill="#50627b">The soil is dry</text>
    <text x="165" y="135" text-anchor="middle" font-size="20" fill="#50627b">Rain is not expected</text>
    <text x="165" y="170" text-anchor="middle" font-size="20" fill="#50627b">Water is available</text>
  </g>
  <g transform="translate(485,135)">
    <rect width="330" height="245" rx="24" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/>
    <text x="165" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#7b5600">Rule</text>
    <text x="165" y="105" text-anchor="middle" font-size="20" fill="#50627b">IF soil is dry</text>
    <text x="165" y="140" text-anchor="middle" font-size="20" fill="#50627b">AND rain is not expected</text>
    <text x="165" y="175" text-anchor="middle" font-size="20" fill="#50627b">THEN irrigation is needed</text>
  </g>
  <g transform="translate(890,135)">
    <rect width="330" height="245" rx="24" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/>
    <text x="165" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#245d3c">Inference</text>
    <text x="165" y="110" text-anchor="middle" font-size="23" font-weight="700" fill="#245d3c">Irrigation is needed</text>
    <text x="165" y="160" text-anchor="middle" font-size="19" fill="#50627b">A conclusion follows when</text>
    <text x="165" y="188" text-anchor="middle" font-size="19" fill="#50627b">the rule conditions are satisfied</text>
  </g>
  <line x1="410" y1="258" x2="475" y2="258" stroke="#8ea1bf" stroke-width="6"/>
  <polygon points="475,258 450,243 450,273" fill="#8ea1bf"/>
  <line x1="815" y1="258" x2="880" y2="258" stroke="#8ea1bf" stroke-width="6"/>
  <polygon points="880,258 855,243 855,273" fill="#8ea1bf"/>

  <text x="650" y="480" text-anchor="middle" font-size="21" font-weight="700" fill="#173a75">Symbolic AI makes knowledge and reasoning steps explicit.</text>
  <text x="650" y="515" text-anchor="middle" font-size="19" fill="#667085">The challenge is representing enough correct knowledge and handling uncertainty or exceptions.</text>
</g>
</svg>