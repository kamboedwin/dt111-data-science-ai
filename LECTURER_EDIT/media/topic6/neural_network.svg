<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="620" viewBox="0 0 1300 620">
<rect width="1300" height="620" rx="32" fill="#f7f9fc"/>
<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">A Simple Feed-Forward Neural Network</text>
<g font-family="Arial">
  <text x="185" y="115" text-anchor="middle" font-size="25" font-weight="700" fill="#173a75">Input layer</text>
  <text x="650" y="115" text-anchor="middle" font-size="25" font-weight="700" fill="#5d477f">Hidden layer</text>
  <text x="1100" y="115" text-anchor="middle" font-size="25" font-weight="700" fill="#245d3c">Output layer</text>

  <g stroke="#b7c4d8" stroke-width="3">
    <line x1="235" y1="225" x2="595" y2="190"/><line x1="235" y1="225" x2="595" y2="310"/><line x1="235" y1="225" x2="595" y2="430"/>
    <line x1="235" y1="395" x2="595" y2="190"/><line x1="235" y1="395" x2="595" y2="310"/><line x1="235" y1="395" x2="595" y2="430"/>
    <line x1="705" y1="190" x2="1045" y2="310"/><line x1="705" y1="310" x2="1045" y2="310"/><line x1="705" y1="430" x2="1045" y2="310"/>
  </g>

  <circle cx="190" cy="225" r="45" fill="#eef4ff" stroke="#7fa2df" stroke-width="4"/><text x="190" y="220" text-anchor="middle" font-size="18" font-weight="700" fill="#173a75">Input 1</text><text x="190" y="245" text-anchor="middle" font-size="15" fill="#50627b">e.g. hours</text>
  <circle cx="190" cy="395" r="45" fill="#eef4ff" stroke="#7fa2df" stroke-width="4"/><text x="190" y="390" text-anchor="middle" font-size="18" font-weight="700" fill="#173a75">Input 2</text><text x="190" y="415" text-anchor="middle" font-size="15" fill="#50627b">attendance</text>

  <circle cx="650" cy="190" r="45" fill="#f3eefb" stroke="#9e86ca" stroke-width="4"/><text x="650" y="199" text-anchor="middle" font-size="22" font-weight="700" fill="#5d477f">H1</text>
  <circle cx="650" cy="310" r="45" fill="#f3eefb" stroke="#9e86ca" stroke-width="4"/><text x="650" y="319" text-anchor="middle" font-size="22" font-weight="700" fill="#5d477f">H2</text>
  <circle cx="650" cy="430" r="45" fill="#f3eefb" stroke="#9e86ca" stroke-width="4"/><text x="650" y="439" text-anchor="middle" font-size="22" font-weight="700" fill="#5d477f">H3</text>

  <circle cx="1090" cy="310" r="55" fill="#f0f8f3" stroke="#79b795" stroke-width="4"/><text x="1090" y="302" text-anchor="middle" font-size="20" font-weight="700" fill="#245d3c">Output</text><text x="1090" y="330" text-anchor="middle" font-size="16" fill="#50627b">prediction</text>

  <text x="650" y="540" text-anchor="middle" font-size="20" fill="#667085">Connections have weights. Training adjusts weights so the network's outputs better match the training targets.</text>
</g>
</svg>