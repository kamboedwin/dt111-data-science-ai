<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Search Algorithms: Exploring a State Space</text>
<g font-family="Arial">
  <circle cx="650" cy="125" r="45" fill="#234f9b"/><text x="650" y="135" text-anchor="middle" font-size="25" font-weight="700" fill="white">Start</text>

  <line x1="620" y1="160" x2="410" y2="260" stroke="#8ea1bf" stroke-width="5"/>
  <line x1="680" y1="160" x2="890" y2="260" stroke="#8ea1bf" stroke-width="5"/>
  <circle cx="390" cy="280" r="38" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/><text x="390" y="288" text-anchor="middle" font-size="23" fill="#245d3c">A</text>
  <circle cx="910" cy="280" r="38" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/><text x="910" y="288" text-anchor="middle" font-size="23" fill="#7b5600">B</text>

  <line x1="365" y1="310" x2="260" y2="410" stroke="#8ea1bf" stroke-width="5"/>
  <line x1="415" y1="310" x2="520" y2="410" stroke="#8ea1bf" stroke-width="5"/>
  <line x1="885" y1="310" x2="780" y2="410" stroke="#8ea1bf" stroke-width="5"/>
  <line x1="935" y1="310" x2="1040" y2="410" stroke="#8ea1bf" stroke-width="5"/>

  <circle cx="240" cy="435" r="36" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/><text x="240" y="443" text-anchor="middle" font-size="21" fill="#173a75">C</text>
  <circle cx="540" cy="435" r="36" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/><text x="540" y="443" text-anchor="middle" font-size="21" fill="#173a75">D</text>
  <circle cx="760" cy="435" r="36" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/><text x="760" y="443" text-anchor="middle" font-size="21" fill="#173a75">E</text>
  <circle cx="1060" cy="435" r="36" fill="#2f7a50"/><text x="1060" y="443" text-anchor="middle" font-size="21" font-weight="700" fill="white">Goal</text>

  <text x="650" y="545" text-anchor="middle" font-size="21" font-weight="700" fill="#173a75">BFS explores level by level · DFS follows a branch deeply · A* uses a heuristic to guide search</text>
  <text x="650" y="580" text-anchor="middle" font-size="19" fill="#667085">Different search strategies can visit states in different orders even when solving the same problem.</text>
