<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="650" viewBox="0 0 1300 650">
<rect width="1300" height="650" rx="32" fill="#f7f9fc"/>
<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Where Bias Can Enter a Data &amp; AI System</text>
<g font-family="Arial">
  <g transform="translate(75,120)"><rect width="350" height="170" rx="22" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/><text x="175" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#173a75">Historical bias</text><text x="175" y="92" text-anchor="middle" font-size="18" fill="#50627b">Past decisions may contain</text><text x="175" y="120" text-anchor="middle" font-size="18" fill="#50627b">existing inequalities</text></g>
  <g transform="translate(475,120)"><rect width="350" height="170" rx="22" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/><text x="175" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#245d3c">Sampling bias</text><text x="175" y="92" text-anchor="middle" font-size="18" fill="#50627b">Collected data may not</text><text x="175" y="120" text-anchor="middle" font-size="18" fill="#50627b">represent intended users</text></g>
  <g transform="translate(875,120)"><rect width="350" height="170" rx="22" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/><text x="175" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#7b5600">Measurement bias</text><text x="175" y="92" text-anchor="middle" font-size="18" fill="#50627b">Variables may measure</text><text x="175" y="120" text-anchor="middle" font-size="18" fill="#50627b">some groups less accurately</text></g>

  <g transform="translate(275,365)"><rect width="350" height="170" rx="22" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/><text x="175" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#5d477f">Label bias</text><text x="175" y="92" text-anchor="middle" font-size="18" fill="#50627b">Training labels may reflect</text><text x="175" y="120" text-anchor="middle" font-size="18" fill="#50627b">inconsistent human judgement</text></g>
  <g transform="translate(675,365)"><rect width="350" height="170" rx="22" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/><text x="175" y="48" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6465">Deployment bias</text><text x="175" y="92" text-anchor="middle" font-size="18" fill="#50627b">A model may be used in a</text><text x="175" y="120" text-anchor="middle" font-size="18" fill="#50627b">context unlike its training setting</text></g>

  <text x="650" y="600" text-anchor="middle" font-size="20" font-weight="700" fill="#173a75">Bias can arise before, during and after model development.</text>
</g>
</svg>