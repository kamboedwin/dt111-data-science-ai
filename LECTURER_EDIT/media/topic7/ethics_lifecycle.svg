<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="620" viewBox="0 0 1300 620">
<rect width="1300" height="620" rx="32" fill="#f7f9fc"/>
<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Ethics Across the Data &amp; AI Lifecycle</text>
<g font-family="Arial">
  <g transform="translate(55,165)"><rect width="200" height="180" rx="22" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/><text x="100" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#173a75">1. Define</text><text x="100" y="92" text-anchor="middle" font-size="17" fill="#50627b">Purpose</text><text x="100" y="120" text-anchor="middle" font-size="17" fill="#50627b">Stakeholders</text><text x="100" y="148" text-anchor="middle" font-size="17" fill="#50627b">Possible harms</text></g>
  <g transform="translate(295,165)"><rect width="200" height="180" rx="22" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/><text x="100" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#245d3c">2. Collect</text><text x="100" y="92" text-anchor="middle" font-size="17" fill="#50627b">Privacy</text><text x="100" y="120" text-anchor="middle" font-size="17" fill="#50627b">Consent</text><text x="100" y="148" text-anchor="middle" font-size="17" fill="#50627b">Representation</text></g>
  <g transform="translate(535,165)"><rect width="200" height="180" rx="22" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/><text x="100" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#7b5600">3. Develop</text><text x="100" y="92" text-anchor="middle" font-size="17" fill="#50627b">Bias checks</text><text x="100" y="120" text-anchor="middle" font-size="17" fill="#50627b">Validation</text><text x="100" y="148" text-anchor="middle" font-size="17" fill="#50627b">Documentation</text></g>
  <g transform="translate(775,165)"><rect width="200" height="180" rx="22" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/><text x="100" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#5d477f">4. Deploy</text><text x="100" y="92" text-anchor="middle" font-size="17" fill="#50627b">Transparency</text><text x="100" y="120" text-anchor="middle" font-size="17" fill="#50627b">Human oversight</text><text x="100" y="148" text-anchor="middle" font-size="17" fill="#50627b">Appeal routes</text></g>
  <g transform="translate(1015,165)"><rect width="200" height="180" rx="22" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/><text x="100" y="52" text-anchor="middle" font-size="24" font-weight="700" fill="#2b6465">5. Monitor</text><text x="100" y="92" text-anchor="middle" font-size="17" fill="#50627b">Performance</text><text x="100" y="120" text-anchor="middle" font-size="17" fill="#50627b">New harms</text><text x="100" y="148" text-anchor="middle" font-size="17" fill="#50627b">Corrective action</text></g>

  <g stroke="#8498b8" stroke-width="6">
    <line x1="255" y1="255" x2="285" y2="255"/><line x1="495" y1="255" x2="525" y2="255"/><line x1="735" y1="255" x2="765" y2="255"/><line x1="975" y1="255" x2="1005" y2="255"/>
  </g>

  <text x="650" y="430" text-anchor="middle" font-size="26" font-weight="700" fill="#173a75">Ethics is not a final checklist added after development.</text>
  <text x="650" y="468" text-anchor="middle" font-size="20" fill="#667085">It should be considered throughout the system lifecycle.</text>
</g>
</svg>