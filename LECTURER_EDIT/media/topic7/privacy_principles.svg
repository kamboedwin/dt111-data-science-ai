<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="610" viewBox="0 0 1300 610">
<rect width="1300" height="610" rx="32" fill="#f7f9fc"/>
<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Privacy and Responsible Data Use</text>
<g font-family="Arial">
  <g transform="translate(80,130)"><rect width="350" height="180" rx="24" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/><text x="175" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#173a75">Purpose limitation</text><text x="175" y="96" text-anchor="middle" font-size="18" fill="#50627b">Collect and use data for a</text><text x="175" y="124" text-anchor="middle" font-size="18" fill="#50627b">clear, legitimate purpose</text></g>
  <g transform="translate(475,130)"><rect width="350" height="180" rx="24" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/><text x="175" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#245d3c">Data minimisation</text><text x="175" y="96" text-anchor="middle" font-size="18" fill="#50627b">Collect only what is needed</text><text x="175" y="124" text-anchor="middle" font-size="18" fill="#50627b">for the stated purpose</text></g>
  <g transform="translate(870,130)"><rect width="350" height="180" rx="24" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/><text x="175" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#7b5600">Transparency</text><text x="175" y="96" text-anchor="middle" font-size="18" fill="#50627b">Explain what data are used</text><text x="175" y="124" text-anchor="middle" font-size="18" fill="#50627b">and for what reason</text></g>
  <g transform="translate(275,365)"><rect width="350" height="180" rx="24" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/><text x="175" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#5d477f">Security</text><text x="175" y="96" text-anchor="middle" font-size="18" fill="#50627b">Protect information from</text><text x="175" y="124" text-anchor="middle" font-size="18" fill="#50627b">unauthorised access or loss</text></g>
  <g transform="translate(675,365)"><rect width="350" height="180" rx="24" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/><text x="175" y="50" text-anchor="middle" font-size="27" font-weight="700" fill="#2b6465">Retention &amp; deletion</text><text x="175" y="96" text-anchor="middle" font-size="18" fill="#50627b">Do not keep personal data</text><text x="175" y="124" text-anchor="middle" font-size="18" fill="#50627b">longer than necessary</text></g>
</g>
</svg>