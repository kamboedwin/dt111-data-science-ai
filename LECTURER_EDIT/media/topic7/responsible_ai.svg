<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="640" viewBox="0 0 1300 640">
<rect width="1300" height="640" rx="32" fill="#f7f9fc"/>
<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">Responsible AI: Questions to Ask</text>
<g font-family="Arial">
  <circle cx="650" cy="325" r="112" fill="#eef4ff" stroke="#7fa2df" stroke-width="4"/>
  <text x="650" y="312" text-anchor="middle" font-size="31" font-weight="700" fill="#173a75">Responsible</text>
  <text x="650" y="350" text-anchor="middle" font-size="31" font-weight="700" fill="#173a75">AI</text>

  <g transform="translate(80,120)"><rect width="310" height="140" rx="22" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/><text x="155" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#245d3c">Fairness</text><text x="155" y="82" text-anchor="middle" font-size="17" fill="#50627b">Who benefits?</text><text x="155" y="108" text-anchor="middle" font-size="17" fill="#50627b">Who may be disadvantaged?</text></g>
  <g transform="translate(910,120)"><rect width="310" height="140" rx="22" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/><text x="155" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#7b5600">Transparency</text><text x="155" y="82" text-anchor="middle" font-size="17" fill="#50627b">Can people understand</text><text x="155" y="108" text-anchor="middle" font-size="17" fill="#50627b">how the system is used?</text></g>
  <g transform="translate(80,415)"><rect width="310" height="140" rx="22" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/><text x="155" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#5d477f">Accountability</text><text x="155" y="82" text-anchor="middle" font-size="17" fill="#50627b">Who is responsible for</text><text x="155" y="108" text-anchor="middle" font-size="17" fill="#50627b">decisions and corrections?</text></g>
  <g transform="translate(910,415)"><rect width="310" height="140" rx="22" fill="#edf8f8" stroke="#78b2b3" stroke-width="3"/><text x="155" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#2b6465">Human oversight</text><text x="155" y="82" text-anchor="middle" font-size="17" fill="#50627b">Can a person review,</text><text x="155" y="108" text-anchor="middle" font-size="17" fill="#50627b">override or appeal?</text></g>

  <g stroke="#8ea1bf" stroke-width="5">
    <line x1="390" y1="195" x2="555" y2="270"/><line x1="910" y1="195" x2="745" y2="270"/>
    <line x1="390" y1="485" x2="555" y2="385"/><line x1="910" y1="485" x2="745" y2="385"/>
  </g>
</g>
</svg>