<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="590" viewBox="0 0 1300 590">
<rect width="1300" height="590" rx="32" fill="#f7f9fc"/>
<text x="650" y="58" text-anchor="middle" font-family="Arial" font-size="36" font-weight="700" fill="#173a75">AI for Mobility and Accessibility</text>
<g font-family="Arial">
  <g transform="translate(75,145)">
    <rect width="250" height="210" rx="24" fill="#eef4ff" stroke="#7fa2df" stroke-width="3"/>
    <text x="125" y="50" text-anchor="middle" font-size="25" font-weight="700" fill="#173a75">Context Data</text>
    <text x="125" y="92" text-anchor="middle" font-size="17" fill="#50627b">Location</text>
    <text x="125" y="120" text-anchor="middle" font-size="17" fill="#50627b">Path conditions</text>
    <text x="125" y="148" text-anchor="middle" font-size="17" fill="#50627b">Accessible entrances</text>
    <text x="125" y="176" text-anchor="middle" font-size="17" fill="#50627b">Transport status</text>
  </g>
  <g transform="translate(400,145)">
    <rect width="250" height="210" rx="24" fill="#f0f8f3" stroke="#79b795" stroke-width="3"/>
    <text x="125" y="50" text-anchor="middle" font-size="25" font-weight="700" fill="#245d3c">AI Processing</text>
    <text x="125" y="95" text-anchor="middle" font-size="17" fill="#50627b">Route search</text>
    <text x="125" y="123" text-anchor="middle" font-size="17" fill="#50627b">Obstacle detection</text>
    <text x="125" y="151" text-anchor="middle" font-size="17" fill="#50627b">Prediction</text>
    <text x="125" y="179" text-anchor="middle" font-size="17" fill="#50627b">Preference matching</text>
  </g>
  <g transform="translate(725,145)">
    <rect width="250" height="210" rx="24" fill="#fff8e8" stroke="#d6a94f" stroke-width="3"/>
    <text x="125" y="50" text-anchor="middle" font-size="25" font-weight="700" fill="#7b5600">Accessible Output</text>
    <text x="125" y="95" text-anchor="middle" font-size="17" fill="#50627b">Step-free route</text>
    <text x="125" y="123" text-anchor="middle" font-size="17" fill="#50627b">Audio guidance</text>
    <text x="125" y="151" text-anchor="middle" font-size="17" fill="#50627b">Obstacle warning</text>
    <text x="125" y="179" text-anchor="middle" font-size="17" fill="#50627b">Alternative options</text>
  </g>
  <g transform="translate(1020,145)">
    <rect width="205" height="210" rx="24" fill="#f3eefb" stroke="#9e86ca" stroke-width="3"/>
    <text x="102" y="50" text-anchor="middle" font-size="25" font-weight="700" fill="#5d477f">User</text>
    <text x="102" y="95" text-anchor="middle" font-size="17" fill="#50627b">Choice</text>
    <text x="102" y="123" text-anchor="middle" font-size="17" fill="#50627b">Feedback</text>
    <text x="102" y="151" text-anchor="middle" font-size="17" fill="#50627b">Correction</text>
  </g>
  <g stroke="#8799b6" stroke-width="6">
    <line x1="325" y1="250" x2="390" y2="250"/><line x1="650" y1="250" x2="715" y2="250"/><line x1="975" y1="250" x2="1010" y2="250"/>
  </g>
  <text x="650" y="445" text-anchor="middle" font-size="22" font-weight="700" fill="#173a75">Accessibility depends on accurate local information, inclusive design and user control.</text>
  <text x="650" y="482" text-anchor="middle" font-size="19" fill="#667085">A route is not accessible merely because it is the shortest.</text>
